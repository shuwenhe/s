# Clean-room self-host acceptance.
#
# Builds the EXACT pinned revision from scratch (C Seed -> Stage1 -> Stage2 ->
# Stage3), verifies byte-for-byte convergence, and runs the full production
# regression. No compiler artifacts are cached or reused; every stage is
# produced fresh from the frozen source tree.
#
# Pinned action versions (commit SHAs) for supply-chain reproducibility:
#   actions/checkout         v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/upload-artifact  v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
#
# NOTE: this is the canonical preserved copy of the CI workflow. The repository
# tree's .github/workflows/selfhost.yml was removed by repo commit c8448bcb8
# ("Remove GitHub Actions workflows") and is reverted when written there; place
# this content at .github/workflows/selfhost.yml to (re-)enable CI.
name: selfhost-cleanroom-acceptance

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      frozen_revision:
        description: "Frozen revision SHA to validate (defaults to the triggering commit)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: selfhost-cleanroom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanroom:
    # ubuntu-latest ships git/gcc/make/binutils/python3; ci-core.sh installs the
    # remaining host tools (ripgrep, strace, time, file) via apt.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Harden runner (audit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Determine frozen revision
        id: rev
        shell: bash
        run: |
          REV="${{ github.event.inputs.frozen_revision }}"
          if [ -z "${REV}" ]; then REV="${{ github.sha }}"; fi
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "frozen revision: ${REV}"

      - name: Run clean-room acceptance (ci-core.sh)
        shell: bash
        run: |
          COMMAND_PATH="$(command -v sudo || true)"
          if [ -n "${COMMAND_PATH}" ]; then SUDO=sudo; else SUDO=; fi
          ${SUDO} ./misc/scripts/ci-core.sh "${{ steps.rev.outputs.revision }}" /tmp/cleanroom-ci

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanroom-evidence-${{ steps.rev.outputs.revision }}
          path: /tmp/cleanroom-ci
          if-no-files-found: error
          retention-days: 30
